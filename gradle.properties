org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# --- Platform (same layout as the official NeoForge MDK) ---
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.248
loader_version_range=[1,)

# --- Mod ---
mod_id=diesel_x_stellaris
mod_name=Diesel x Stellaris
mod_version=1.6.0
mod_license=MIT
mod_authors=Diesel x Stellaris contributors
mod_group_id=com.dieselxstellaris
# Change these two when your CurseForge project page exists (they are shown in the in-game mod list).
mod_url=https://www.curseforge.com/minecraft/mc-mods/diesel-x-stellaris
mod_issues_url=https://www.curseforge.com/minecraft/mc-mods/diesel-x-stellaris/issues
mod_description=Adds the Alternative Engine rocket upgrade, and lets the Create Spout pour Create: Diesel Generators diesel into the Stellaris Jet Suit chestplate.

# --- Dependency versions (used in neoforge.mods.toml) ---
create_version=6.0.10
cdg_version=1.21.1-1.3.15
stellaris_version=1.4.25
architectury_version=13.0.11
potentials_version=0.7.0
jei_version=19.56.0.441

# --- Jars in ./libs ---
# REQUIRED to build (compile only). Do NOT publish these files, see docs/PUBLISHING.md:
stellaris_jar=stellaris-1_21-neoforge-1_4_25.jar
architectury_jar=architectury-13_0_11-neoforge.jar
potentials_jar=potentials-neoforge-1_21-0_7_1.jar
# OPTIONAL, only to start the game from the IDE (runClient). Used if the files exist:
create_jar=create-1_21_1-6_0_10.jar
cdg_jar=createdieselgenerators-1_21_1-1_3_15.jar

# Put JEI on the dev runtime classpath (the JEI version is unverified, off by default)
use_jei=false
