name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check that the dependency jars were uploaded
        run: |
          echo "Files in libs:"
          ls -la libs
          test -f libs/stellaris-1_21-neoforge-1_4_25.jar
          test -f libs/architectury-13_0_11-neoforge.jar
          test -f libs/potentials-neoforge-1_21-0_7_1.jar

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build
        run: gradle build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: diesel_x_stellaris
          path: build/libs/*.jar
          if-no-files-found: error
